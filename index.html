```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yahtzee Dice Roller</title>

    <link rel="stylesheet" href="style.css">
</head>

<body onload="wakeServerAndStart()">

    <div class="container">

        <h1>Yahtzee Dice Roller</h1>

        <p class="instructions">
            Roll the dice and try to get the best combination!
            Click on a die to hold it before rolling again.
        </p>

        <div class="dice-area">

            <div class="die-container" id="dieContainer1" onclick="toggleHold(1)">
                <input type="text" id="die1" value="" readonly>
                <p id="hold1">Click to Hold</p>
            </div>

            <div class="die-container" id="dieContainer2" onclick="toggleHold(2)">
                <input type="text" id="die2" value="" readonly>
                <p id="hold2">Click to Hold</p>
            </div>

            <div class="die-container" id="dieContainer3" onclick="toggleHold(3)">
                <input type="text" id="die3" value="" readonly>
                <p id="hold3">Click to Hold</p>
            </div>

            <div class="die-container" id="dieContainer4" onclick="toggleHold(4)">
                <input type="text" id="die4" value="" readonly>
                <p id="hold4">Click to Hold</p>
            </div>

            <div class="die-container" id="dieContainer5" onclick="toggleHold(5)">
                <input type="text" id="die5" value="" readonly>
                <p id="hold5">Click to Hold</p>
            </div>

        </div>

        <p id="rollCount">Rolls: 0</p>

        <div class="buttons">

            <button id="rollButton" onclick="rollDice()">
                Roll Dice
            </button>

            <button onclick="newTurn()">
                New Turn
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
